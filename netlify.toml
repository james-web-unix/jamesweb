# Netlify Configuration for James Web Portal
# https://docs.netlify.com/configure-builds/file-conventions/

[build]
  publish = "."

# Redirects & Rewrites
[[redirects]]
  from = "https://jamesweblogical.netlify.app/*"
  to = "https://jamesweb.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://jamesweblogical.netlify.app/*"
  to = "https://jamesweb.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/logical"
  to = "/logical/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/assets/pdf/*"
  to = "/pdf/:splat"
  status = 200

[[redirects]]
  from = "/books/*"
  to = "/books/:splat"
  status = 200

# Headers for SEO & Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
