<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="256" cy="256" r="240" fill="#04050f" stroke="url(#grad1)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner Web Pattern (Subtle) -->
  <circle cx="256" cy="256" r="180" stroke="rgba(0, 210, 255, 0.1)" stroke-width="2" />
  <circle cx="256" cy="256" r="120" stroke="rgba(0, 210, 255, 0.1)" stroke-width="2" />
  <circle cx="256" cy="256" r="60" stroke="rgba(0, 210, 255, 0.1)" stroke-width="2" />
  
  <!-- Stylized JW -->
  <path d="M180 180H332M256 180V340C256 370 230 380 200 380" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M332 180V380" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Accent Dot -->
  <circle cx="332" cy="380" r="16" fill="url(#grad1)" />
  
</svg>
